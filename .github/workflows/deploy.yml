# ============================================================================
# MeiLearning System — Auto Deploy via GitHub Actions
# ============================================================================
# Trigger: push vào branch main
# Flow: SSH vào VPS → backup DB → run migration → git pull → docker compose
# ============================================================================

name: "🚀 Deploy to VPS"

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.env.example'
      - 'docker/**'              # Trigger khi có migration mới
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: "🔐 Deploy via SSH"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ~/MeiLearning-System

            echo "💾 Backing up database before deploy..."
            ./backup.sh

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🗄️ Running database migrations..."
            cat docker/migrate.sql \
              | docker exec -i meilearning-db psql \
                  -U "${DB_USERNAME:-postgres}" \
                  -d "${DB_NAME:-meilearning}"
            echo "✅ Migration completed."

            echo "🔨 Building & restarting containers..."
            docker compose up -d --build

            echo "⏳ Waiting for backend to be ready (max 2 min)..."
            for i in $(seq 1 12); do
              if docker exec meilearning-backend curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
                echo "✅ Backend is healthy!"
                break
              fi
              echo "   Attempt $i/12 — waiting 10s..."
              sleep 10
            done

            echo "🔍 Container status:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo "📋 Backend last 20 lines:"
            docker logs meilearning-backend --tail 20

            echo "🎉 Deploy completed successfully!"
