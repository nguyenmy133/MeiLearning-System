# ============================================================================
# MeiLearning System — Auto Deploy via GitHub Actions
# ============================================================================
# Trigger: push vào branch main
# Flow: SSH vào VPS → backup DB → git pull → docker compose build & restart
# ============================================================================

name: "\U0001F680 Deploy to VPS"

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - '.env.example'
  workflow_dispatch:    # Cho phép trigger thủ công từ GitHub UI

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: "\U0001F510 Deploy via SSH"
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ~/MeiLearning-System

            echo "💾 Backing up database before deploy..."
            ./backup.sh

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Building & restarting containers..."
            docker compose up -d --build

            echo "⏳ Waiting for backend to start..."
            sleep 30

            echo "🔍 Checking container status..."
            docker ps

            echo "✅ Deploy completed!"
