# ============================================================================
# MeiLearning System — Docker Compose
# ============================================================================
# Usage:
#   docker compose up -d          # Start all services
#   docker compose down           # Stop all services
#   docker compose logs -f        # View logs
# ============================================================================

services:
  # ── PostgreSQL Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: meilearning-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-meilearning}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Spring Boot) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meilearning-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-meilearning}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHNhbXBsZSBzZWNgnsdfrewga2V5IGZvciBkZXZlbG9wbWVudCBvbmx5IQ==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # ── Logging ──
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      LOG_LEVEL_SECURITY: ${LOG_LEVEL_SECURITY:-INFO}
      # ── JPA ──
      DDL_AUTO: ${DDL_AUTO:-update}
      SHOW_SQL: ${SHOW_SQL:-false}
      # ── Email ──
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # ── SMS (SpeedSMS) ──
      SPEEDSMS_API_KEY: ${SPEEDSMS_API_KEY:-}
      SPEEDSMS_SENDER: ${SPEEDSMS_SENDER:-Notify}
      SPEEDSMS_TYPE: ${SPEEDSMS_TYPE:-2}
      SPEEDSMS_MAX_PER_DAY: ${SPEEDSMS_MAX_PER_DAY:-3}
      # ── Zalo ──
      ZALO_ENABLED: ${ZALO_ENABLED:-false}
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      ZALO_OA_ID: ${ZALO_OA_ID:-}
      ZALO_REFRESH_TOKEN: ${ZALO_REFRESH_TOKEN:-}
      ZALO_ZNS_TEMPLATE_ID: ${ZALO_ZNS_TEMPLATE_ID:-}
    # ports:
      # - "${SERVER_PORT:-8080}:8080"  # Không expose ra ngoài — chỉ Caddy proxy truy cập
    volumes:
      - uploads_data:/app/uploads

  # ── Frontend (Caddy — SPA only) ──────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: meilearning-frontend
    restart: unless-stopped
    depends_on:
      - backend
    # Không expose port ra ngoài — chỉ Caddy proxy truy cập
    expose:
      - "80"

  # ── Caddy Reverse Proxy (Entry Point) ────────────────────────────
  caddy:
    image: caddy:alpine
    container_name: meilearning-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
