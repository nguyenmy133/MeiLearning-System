# ============================================================================
# MeiLearning System — Production Profile Configuration
# ============================================================================
# Activated with: SPRING_PROFILES_ACTIVE=prod
# Overrides values from application.properties
# ============================================================================

# ── Database (MUST set via env vars) ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.meilearning.backend=INFO
logging.level.org.springframework.security=WARN

# ── Swagger / OpenAPI — Disabled in Production ───────────────────────────────
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ── Actuator — Restrict exposure ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
