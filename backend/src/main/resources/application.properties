# ============================================================================
# MeiLearning System — Backend Configuration
# ============================================================================

spring.application.name=MeiLearning Backend


server.port=8080
server.servlet.context-path=/


spring.datasource.url=jdbc:postgresql://localhost:5433/meilearning
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect



app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHNhbXBsZSBzZWNyZXQga2V5IGZvciBkZXZlbG9wbWVudCBvbmx5IQ==}

app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

logging.level.com.meilearning.backend=DEBUG
logging.level.org.springframework.security=INFO

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
