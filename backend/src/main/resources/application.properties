# ============================================================================
# MeiLearning System — Backend Configuration
# ============================================================================

spring.application.name=MeiLearning Backend

# ── Server ──────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── Database (MySQL) ────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/meilearning?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ─────────────────────────────────────────────────────────
# IMPORTANT: Thay secret bằng giá trị random dài ≥ 256-bit (Base64) cho production!
app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHNhbXBsZSBzZWNyZXQga2V5IGZvciBkZXZlbG9wbWVudCBvbmx5IQ==}
# Token hết hạn sau 24h (86400000ms)
app.jwt.expiration-ms=86400000

# ── CORS ────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ── Logging ─────────────────────────────────────────────────────
logging.level.meilearning.com.backend=DEBUG
logging.level.org.springframework.security=INFO
