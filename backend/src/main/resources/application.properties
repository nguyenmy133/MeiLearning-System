# ============================================================================
# MeiLearning System — Backend Configuration
# ============================================================================
# ⚠️ IMPORTANT: Sensitive values use environment variables.
#    For development: set vars in .env or use application-dev.properties
#    For production:  MUST set JWT_SECRET, DB_PASSWORD as env vars
# ============================================================================

spring.application.name=MeiLearning Backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meilearning}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT Security ─────────────────────────────────────────────────────────────
# ⚠️ PRODUCTION: MUST set JWT_SECRET env var (min 64 chars, Base64-encoded)
#    The fallback below is ONLY for local development!
app.jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHNhbXBsZSBzZWNyZXQga2V5IGZvciBkZXZlbG9wbWVudCBvbmx5IQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.meilearning.backend=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}

# ── Swagger / OpenAPI ────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ── File Upload ──────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Actuator (Health Check / Monitoring) ─────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=MeiLearning Backend
info.app.description=Hệ thống quản lý trung tâm giáo dục
info.app.version=1.0.0

# ── Email (Gmail SMTP) ───────────────────────────────────────────────────────
# ⚠️ Dùng App Password, KHÔNG phải mật khẩu Gmail thường!
# Tạo App Password: Google Account → Security → 2-Step Verification → App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@meilearning.vn}}

# ── SMS (SpeedSMS) ───────────────────────────────────────────────────────────
app.sms.api-key=${SPEEDSMS_API_KEY:}
app.sms.sender=${SPEEDSMS_SENDER:Notify}
app.sms.type=${SPEEDSMS_TYPE:4}
app.sms.max-per-day=${SPEEDSMS_MAX_PER_DAY:3}

# ── Thymeleaf (off for REST API — chỉ dùng cho email templates) ─────────────
spring.thymeleaf.enabled=false

# ── Zalo OA (ZNS Notification) ──────────────────────────────────────────────
app.zalo.enabled=${ZALO_ENABLED:true}
app.zalo.app-id=${ZALO_APP_ID:}
app.zalo.app-secret=${ZALO_APP_SECRET:}
app.zalo.oa-id=${ZALO_OA_ID:}
app.zalo.refresh-token=${ZALO_REFRESH_TOKEN:}
app.zalo.zns-template-id=${ZALO_ZNS_TEMPLATE_ID:}
